services:
  - type: web
    name: sheng-stock-v6
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    envVars:
      - key: TZ
        value: Asia/Taipei
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: AUTO_PUSH_ENABLED
        value: "0"
      - key: DEFAULT_PRICE_MIN
        value: "10"
      - key: DEFAULT_PRICE_MAX
        value: "300"
      - key: DEFAULT_ANALYSIS_MODE
        value: "1"
